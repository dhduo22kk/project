    header.innerHTML = `
      <div class="domain-icon">${DOMAIN_ICONS[domain] || '📁'}</div>
      <div class="domain-name">${domain}</div>
      <span class="badge">${totalTables}</span>
      <span class="badge badge-gray" style="margin-left:4px">${Object.keys(groups).length}그룹</span>
      <span class="chevron ${isOpen ? 'open' : ''}" id="chev-${btoa(encodeURIComponent(domain)).replace(/=/g,'')}">▶</span>
    `;
    header.onclick = () => toggleDomain(domKey);
    
    const body = document.createElement('div');
    body.className = 'domain-body';
    body.id = 'dom-' + btoa(encodeURIComponent(domain)).replace(/=/g,'');
    if (!isOpen) body.style.display = 'none';
    
    Object.entries(groups).forEach(([group, tables]) => {
      const grpKey = domain + '::' + group;
      const isGrpOpen = expandedGroups[grpKey] !== false;
      
      const grpBlock = document.createElement('div');
      grpBlock.className = 'group-block';
      grpBlock.dataset.group = group;
      
      const grpHeader = document.createElement('div');
      grpHeader.className = 'group-header';
      grpHeader.innerHTML = `
        <div class="group-dot"></div>
        <div class="group-name">${group}</div>
        <span class="badge-sm">${tables.length}</span>
        <span class="chevron-sm ${isGrpOpen ? 'open' : ''}" id="gchev-${btoa(encodeURIComponent(grpKey)).replace(/=/g,'')}">▶</span>
      `;
      grpHeader.onclick = (e) => { e.stopPropagation(); toggleGroup(grpKey); };
      
      const tblList = document.createElement('div');
      tblList.className = 'table-list';
      tblList.id = 'grp-' + btoa(encodeURIComponent(grpKey)).replace(/=/g,'');
      if (!isGrpOpen) tblList.style.display = 'none';
      
      tables.forEach(t => {
        const row = document.createElement('div');
        row.className = 'table-row';
        row.dataset.en = t.en.toLowerCase();
        row.dataset.ko = t.ko;
        row.innerHTML = `<span class="tbl-en">${t.en}</span><span class="tbl-ko">${t.ko}</span>`;
        tblList.appendChild(row);
      });
      
      grpBlock.appendChild(grpHeader);
      grpBlock.appendChild(tblList);
      body.appendChild(grpBlock);
    });
    
    block.appendChild(header);
    block.appendChild(body);
    container.appendChild(block);
  });
}

function toggleDomain(key) {
  const encoded = btoa(encodeURIComponent(key)).replace(/=/g,'');
  const body = document.getElementById('dom-' + encoded);
  const chev = document.getElementById('chev-' + encoded);
  const isOpen = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : '';
  chev.classList.toggle('open', !isOpen);
  expandedDomains[key] = !isOpen;
}

function toggleGroup(key) {
  const encoded = btoa(encodeURIComponent(key)).replace(/=/g,'');
  const body = document.getElementById('grp-' + encoded);
  const chev = document.getElementById('gchev-' + encoded);
  const isOpen = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : '';
  chev.classList.toggle('open', !isOpen);
  expandedGroups[key] = !isOpen;
}

function expandAll() {
  document.querySelectorAll('.domain-body').forEach(el => el.style.display = '');
  document.querySelectorAll('.table-list').forEach(el => el.style.display = '');
  document.querySelectorAll('.chevron, .chevron-sm').forEach(el => el.classList.add('open'));
}

function collapseAll() {
  document.querySelectorAll('.domain-body').forEach(el => el.style.display = 'none');
  document.querySelectorAll('.table-list').forEach(el => el.style.display = 'none');
  document.querySelectorAll('.chevron, .chevron-sm').forEach(el => el.classList.remove('open'));
}

function onSearch(q) {
  q = q.toLowerCase().trim();
  const container = document.getElementById('treeContainer');
  
  if (!q) {
    buildTree(DATA);
    return;
  }
  
  // 매칭 테이블 찾기
  let totalMatch = 0;
  document.querySelectorAll('.table-row').forEach(row => {
    const en = row.dataset.en || '';
    const ko = row.dataset.ko || '';
    const match = en.includes(q) || ko.includes(q);
    row.style.display = match ? '' : 'none';
    if (match) totalMatch++;
  });
  
  // 매칭된 테이블 있는 그룹/도메인만 표시
  document.querySelectorAll('.group-block').forEach(gb => {
    const visible = gb.querySelectorAll('.table-row:not([style*="display: none"])').length > 0;
    gb.style.display = visible ? '' : 'none';
    if (visible) {
      const tblList = gb.querySelector('.table-list');
      if (tblList) tblList.style.display = '';
      const chev = gb.querySelector('.chevron-sm');
      if (chev) chev.classList.add('open');
    }
  });
  
  document.querySelectorAll('.domain-block').forEach(db => {
    const visible = db.querySelectorAll('.group-block:not([style*="display: none"])').length > 0;
    db.style.display = visible ? '' : 'none';
    if (visible) {
      const body = db.querySelector('.domain-body');
      if (body) body.style.display = '';
      const chev = db.querySelector('.chevron');
      if (chev) chev.classList.add('open');
    }
  });
  
  document.getElementById('statsBar').textContent = `검색 결과: ${totalMatch}개 테이블`;
}

buildTree(DATA);
</script>
</body>
</html>
